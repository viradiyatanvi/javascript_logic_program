<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-login {
      padding: 12px 20px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .overlay {
      width: 100%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: -1;
      opacity: 0;
      transition: 0.5s;
    }

    .showoverlay {
      opacity: 1;
      z-index: 5;
    }

    .loginForm {
      width: 350px;
      background-color: white;
      padding: 25px 20px;
      border-radius: 8px;
      position: fixed;
      top: -50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: top 0.5s ease;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
      z-index: 6;
    }

    .showloginform {
      top: 50%;
    }

    .loginForm h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    .loginForm div {
      margin-bottom: 15px;
    }

    .loginForm label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .loginForm input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .loginForm button {
      width: 100%;
      background-color: black;
      padding: 10px;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    .loginForm button:hover {
      background-color: #333;
    }

    .loginForm span {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 30px;
      height: 30px;
      background-color: red;
      color: white;
      font-size: 20px;
      line-height: 30px;
      text-align: center;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="btn-login" onclick="showModal()">Login</button>

  <div class="overlay"></div>

  <div class="loginForm">
    <span onclick="closeModal()">&times;</span>
    <h2>Login</h2>
    <form action="">
      <div>
        <label>UserName:</label>
        <input type="text" required />
      </div>
      <div>
        <label>Password:</label>
        <input type="password" required />
      </div>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    function showModal() {
      document.querySelector('.overlay').classList.add('showoverlay');
      document.querySelector('.loginForm').classList.add('showloginform');
    }

    function closeModal() {
      document.querySelector('.overlay').classList.remove('showoverlay');
      document.querySelector('.loginForm').classList.remove('showloginform');
    }

    // Close modal if user clicks outside the login form
    document.querySelector('.overlay').addEventListener('click', closeModal);
  </script>

</body>
</html>
